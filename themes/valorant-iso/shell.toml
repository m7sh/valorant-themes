# Agent-tailored Omarchy shell surface tokens.

[bar]
background       = "#09091A"
background-alpha = 0.95
text             = "#EAE9FA"
active           = "#8E6BFF"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "#8E6BFF #22F0E8 45deg"
active-border-foreground = "#EAE9FA"

[controls]
normal-color        = "#EAE9FA"
normal-fill-alpha   = 0.04
normal-border       = "#686778"
normal-border-width = 1
normal-border-alpha = 0.45

hover-cursor-color        = "#EAE9FA"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#8E6BFF"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.70

focus-color        = "#EAE9FA"
focus-fill-alpha   = 0.12
focus-border       = "#22F0E8"
focus-border-width = 1
focus-border-alpha = 0.80

selected-color        = "#EAE9FA"
selected-fill-alpha   = 0.22
selected-border       = "#8E6BFF"
selected-border-width = 1
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.24
selection-fill-alpha = 0.35

[popups]
background       = "#09091A"
background-alpha = 0.96
text             = "#EAE9FA"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#09091A"
background-alpha = 0.97
text             = "#EAE9FA"
border           = "#22F0E8"
border-alpha     = 0.85

[notifications]
background       = "#09091A"
background-alpha = 0.97
text             = "#EAE9FA"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#22F0E8"

[launcher]
background                = "#09091A"
background-alpha          = 0.95
text                      = "#EAE9FA"
border                    = "hyprland.active-border"
border-alpha              = 1.0
scrim                     = "#04040B"
scrim-alpha               = 0.58
selected-background       = "#8E6BFF"
selected-background-alpha = 0.16
selected-text             = "#8E6BFF"
selected-border           = "hyprland.active-border"
selected-border-alpha     = 0.60

[menu]
background                = "#09091A"
background-alpha          = 0.98
text                      = "#EAE9FA"
border                    = "hyprland.active-border"
border-alpha              = 1.0
scrim                     = "#04040B"
scrim-alpha               = 0.58
selected-background       = "#8E6BFF"
selected-background-alpha = 0.16
selected-text             = "#8E6BFF"
selected-border           = "hyprland.active-border"
selected-border-alpha     = 0.60

[polkit]
background   = "#09091A"
background-alpha = 0.98
text         = "#EAE9FA"
text-error   = "#FF5484"
border       = "hyprland.active-border"
border-error = "#FF5484"
border-alpha = 1.0
scrim        = "#04040B"
scrim-alpha  = 0.58
accent       = "#8E6BFF"

[lock]
background       = "#09091A"
background-alpha = 0.85
text             = "#EAE9FA"
placeholder      = "#828293"
text-error       = "#FF5484"
border           = "hyprland.active-border"
border-active    = "#22F0E8"
border-error     = "#FF5484"
border-alpha     = 1.0
selection        = "#8E6BFF"
selection-alpha  = 0.40

[image-picker]
text                    = "#EAE9FA"
selected-border         = "#8E6BFF"
selected-border-alpha   = 1.0
unselected-border       = "#686778"
unselected-border-alpha = 0.35
